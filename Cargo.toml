[package]
name = "universal-self-healing-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Native ast-grep extraction with single-batch, validated rule healing"

[dependencies]
ast-grep-config = "=0.51.0"
ast-grep-core = "=0.51.0"
ast-grep-language = "=0.51.0"
async-trait = "0.1.92"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["fs", "rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
dotenvy = "0.15.7"
